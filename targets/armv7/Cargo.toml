[package]
name = "gabix-armv7"
version = "0.1.0"
edition = "2021"
# Bare-metal fixtures below are explicit binaries, not hosted test harnesses.
autotests = false

[[bin]]
name = "gabix-armv7"
path = "src/main.rs"

[[bin]]
name = "pi2-loader"
path = "src/pi2_loader.rs"

[[bin]]
name = "pi2-handoff-probe"
path = "src/pi2_handoff_probe.rs"

[[bin]]
name = "pi2-svc-probe"
path = "src/pi2_svc_probe.rs"

[[bin]]
name = "pi2-bss-probe"
path = "src/pi2_bss_probe.rs"

[[bin]]
name = "pi2-allocator-probe"
path = "src/pi2_allocator_probe.rs"

[[bin]]
name = "pi2-rust-probe"
path = "src/pi2_rust_probe.rs"

[[bin]]
name = "pi2-rust-bss-probe"
path = "src/pi2_rust_bss_probe.rs"

[[bin]]
name = "pi2-allocator-init-probe"
path = "src/pi2_allocator_init_probe.rs"

[[bin]]
name = "pi2-large-bss-probe"
path = "src/pi2_large_bss_probe.rs"

[[bin]]
name = "pi2-atomic-probe"
path = "src/pi2_atomic_probe.rs"

[[bin]]
name = "pi2-mmu-atomic-probe"
path = "src/pi2_mmu_atomic_probe.rs"

[[bin]]
name = "pi2-usb-enumeration-probe"
path = "src/pi2_usb_enumeration_probe.rs"

[[bin]]
name = "pi2-lan9512-configure-probe"
path = "src/pi2_lan9512_configure_probe.rs"

[[bin]]
name = "pi2-lan9512-transmit-probe"
path = "src/pi2_lan9512_transmit_probe.rs"

[[bin]]
name = "pi2-lan9512-receive-probe"
path = "src/pi2_lan9512_receive_probe.rs"

[dependencies]
gabix-kernel = { path = "../../crates/kernel-core", default-features = false }
linked_list_allocator = "0.10"

[features]
default = []
virt = ["gabix-kernel/kernel"]
raspi2b = ["gabix-kernel/kernel"]
pi-hardware = ["raspi2b"]
pi-network-dev = ["pi-hardware"]
pi-network-dhcp-size-probe = []
pi-network-dhcp-packet-probe = []
pi-network-pre-timer-probe = ["pi-hardware"]
pi-network-arp-receive-probe = []
pi-network-arp-reply-probe = ["pi-network-arp-receive-probe"]
pi-network-repeated-receive-probe = []
pi-network-no-irq-dev = ["pi-hardware"]
pi-lifecycle = ["raspi2b"]
pi-uart-user = ["raspi2b"]
pi-sd-loader = ["gabix-kernel/kernel"]
pi-sd-transfer = ["pi-hardware", "pi-uart-user"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "pi2-sd-check"
path = "tests/sd_write.rs"
test = false
bench = false

[[bin]]
name = "pi2-loader-trial"
path = "tests/loader_trial.rs"
test = false
bench = false
