[package]
name = "mini-os"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "0.15"
pic8259 = "0.10"
linked_list_allocator = "0.10"

[features]
# QEMU target adapter: report panic and init exit through isa-debug-exit.
qemu-exit = []
