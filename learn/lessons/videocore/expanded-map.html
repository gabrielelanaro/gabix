is an instruction that reads a value from an address into a processor register."},{"name":"V3D graphics hardware","label":"V3D","context":"V3D converts the three vertex records supplied by Gabix into a triangle in memory.","general":"V3D is the Pi’s 3D graphics engine. Some of its circuits have fixed jobs. Its QPUs execute programs."},{"name":"Main RAM","label":"Main RAM","context":"The vertex records are in main RAM before the draw. The finished image is there afterward.","general":"RAM is read/write memory organized into addressable locations. A byte holds eight bits."},{"name":"Buffer","label":"Buffer","context":"The probe reserves an output buffer large enough to return every pixel.","general":"A buffer is a region of storage reserved for data with a particular use."},{"name":"Drawing command","label":"Drawing command","context":"The draw packet in Gabix asks for a triangle made from three consecutive vertex records.","general":"A drawing command is an encoded request interpreted by graphics hardware."},{"name":"Start-address register","label":"Start-address register","context":"Gabix writes the address of the first byte in the selected command list here.","general":"When starting a V3D control list, this register supplies the address where fetching begins."},{"name":"End-address register","label":"End-address register","context":"Gabix writes the address just past the final list byte. That write starts execution.","general":"On V3D this register gives the executor its stopping address."},{"name":"GPU control thread 0","label":"GPU control thread 0","context":"Gabix submits its binning list to hardware thread 0.","general":"On V3D, control thread 0 is the command execution context for binning."},{"name":"GPU control thread 1","label":"GPU control thread 1","context":"The argument thread = 1 selects the registers Gabix uses to submit its rendering list.","general":"On V3D, control thread 1 is the command execution context for rendering tiles."},{"name":"Rendering control list","label":"Rendering list","context":"Gabix selects its single tile, calls the tile list, then requests the final store.","general":"A rendering control list specifies how to produce the image one tile at a time."},{"name":"Memory address","label":"Memory address","context":"Gabix converts the pointer to its command list into an address V3D can use.","general":"A memory address is a number that selects a location from the reader’s or writer’s point of view."},{"name":"Geometry hardware","label":"Geometry hardware","context":"The binner examines the triangle’s positions to determine which tile needs work.","general":"Geometry hardware processes information about the positions of shapes."},{"name":"Tile rendering hardware","label":"Tile rendering hardware","context":"It renders tile (0,0), which covers the whole image in this probe.","general":"Tile rendering hardware produces image values for one rectangular region at a time."},{"name":"Shader instruction","label":"Shader instruction","context":"The instruction ldi r3 loads the packed triangle color into r3.","general":"A shader instruction is one encoded operation executed by a programmable graphics processor."},{"name":"Vertex Cache Manager (VCM)","label":"Vertex Cache Manager","context":"For this draw the input records the manager must organize describe three corners.","general":"The VCM groups vertex records into batches for processing."},{"name":"Vertex Cache DMA (VCD)","label":"Vertex Cache DMA","context":"It fetches Gabix’s prepared vertex records from RAM into Vertex Pipe Memory.","general":"VCD is the transfer circuitry for vertex data. Direct memory access lets hardware move bytes without a CPU copy for each value."},{"name":"Vertex Pipe Memory (VPM)","label":"Vertex Pipe Memory","context":"VPM holds the prepared corner data used by the triangle hardware.","general":"VPM is local working memory inside V3D for batches of vertex data."},{"name":"Coordinate shader","label":"Coordinate shader","context":"Gabix supplies screen coordinates directly, so its triangle skips this program.","general":"In V3D’s GL mode a coordinate shader computes positions used during binning."},{"name":"Vertex shader","label":"Vertex shader","context":"Gabix’s prepared vertex records let the rendering pass skip vertex shading.","general":"A vertex shader is a program that computes output values for a vertex, such as its position or color attributes."},{"name":"Vertex","label":"Vertex","context":"The triangle’s top corner has screen coordinates (32,8). Its vertex record also carries other values.","general":"A vertex is a point used to define a shape. A vertex record stores the point’s position plus any associated attributes."},{"name":"Primitive","label":"Primitive","context":"The draw specifies three vertices forming one triangle, so this draw contains one primitive.","general":"A primitive is an individual geometric shape processed by a draw, such as a point, line or triangle."},{"name":"Tile","label":"Tile","context":"The probe’s 64 × 64 framebuffer fits into one tile.","general":"A tile is a rectangular region of the output image that the GPU processes as a unit."},{"name":"Edge parameters","label":"Edge parameters","context":"The setup circuit derives these values from the triangle’s three corner positions.","general":"Edge parameters describe a boundary numerically so hardware can test which side contains a sample point."},{"name":"Interpolation coefficients","label":"Interpolation coefficients","context":"Gabix supplies the same color attributes at each corner, so interpolation produces no color gradient.","general":"Interpolation coefficients describe how to compute a value at an interior location from values specified at the corners."},{"name":"Front End Pipeline (FEP)","label":"Front End Pipeline","context":"Its rasterizer receives the triangle’s edge parameters from the setup engine.","general":"The FEP is the V3D hardware stage that handles rasterization plus early operations such as depth testing."},{"name":"Sample location","label":"Sample location","context":"The triangle draw uses one sample per pixel. The rasterizer tests whether that sample lies inside the triangle.","general":"A sample location is a particular point within a pixel used for a coverage test."},{"name":"Coverage","label":"Coverage","context":"Samples inside Gabix’s triangle receive its color. The surrounding region keeps the clear color.","general":"Coverage records which sample locations a shape occupies."},{"name":"Pixel","label":"Pixel","context":"The image returned by the probe contains 4,096 pixels.","general":"A pixel is one addressable position on an image grid, typically associated with a color value."},{"name":"Per-vertex attributes","label":"Per-vertex attributes","context":"Each Gabix corner record includes three color values in addition to its position.","general":"A per-vertex attribute is an input value supplied separately for each vertex."},{"name":"interpolation at fragment positions","label":"Fragment interpolation","context":"The fragment program reads three interpolated inputs even though it uses a constant for the final color.","general":"Interpolation computes a value at a location using values at surrounding points. Halfway between equally weighted endpoint values of zero and one, the result is one half."},{"name":"Slice","label":"Slice","context":"The QPU executing Gabix’s color program belongs to a slice.","general":"A slice is a hardware group of QPUs with shared resources such as an instruction cache."},{"name":"Instruction cache","label":"Instruction cache","context":"Gabix invalidates the slice caches before running the uploaded shader code.","general":"An instruction cache holds recently fetched program instructions near the processors that execute them."},{"name":"Texture lookup unit (TMU)","label":"Texture lookup unit","context":"Gabix’s shader loads its color directly, so this draw issues no texture lookup.","general":"A TMU fet age for this draw.","general":"Texture data consists of stored values that a shader can look up, often colors arranged in an image."},{"name":"Shared L2 cache","label":"Shared L2 cache","context":"Gabix enables and clears V3D’s L2 before submitting the triangle.","general":"L2 is a second level of cache shared across slices. It can serve requests from their local caches."},{"name":"QPU color writes","label":"QPU color writes","context":"The shader’s write to tlbc sends the chosen color to the tile buffer.","general":"A QPU color write is an operation that updates color at the fragment positions currently being shaded."},{"name":"Store-tile command","label":"Store-tile command","context":"The last rendering packet stores the probe’s only tile and marks the end of its frame.","general":"A tile store transfers completed tile values from on-chip storage to a destination in main memory."},{"name":"VG mode","label":"VG mode","context":"The probe uses NV mode with prepared vertices. VG is an alternative supported by this GPU.","general":"VG is V3D’s vector-graphics mode, which accepts two-dimensional coordinates for drawing paths."},{"name":"Coverage accumulation pipeline","label":"Coverage accumulator","context":"Gabix draws a triangle through the 3D rasterizer. Its draw does not use this vector-path circuit.","general":"This V3D circuit accumulates coverage information when rendering vector paths in OpenVG mode."},{"name":"Binning completion","label":"Binning completion","context":"Gabix waits for its binning list to flush before submitting the rendering list.","general":"Binning completion means the GPU has finished preparing the tile work lists for the submitted geometry."},{"name":"Binning flush counter","label":"Binning flush counter","context":"The submission routine reads this counter before starting thread 0, then waits for its value to change.","general":"This V3D register counts binning flush events."},{"name":"Frame completion","label":"Frame completion","conte
