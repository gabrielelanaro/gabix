<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <rect width="1200" height="1000" fill="#f7f8fa"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Raspberry Pi 2 UART wiring</text>
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">40-pin header viewed from above: pin 1 is upper-left</text>

  <rect x="70" y="125" width="500" height="790" rx="18" fill="#4b5563"/>
  <text x="320" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">J8 40-pin header</text>
  <text x="190" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db">odd pins</text>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d1d5db">even pins</text>

  <g font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <rect x="120" y="210" width="400" height="625" rx="10" fill="#6b7280"/>
    <g stroke="#111827" stroke-width="2">
      <circle cx="190" cy="235" r="22" fill="#f59e0b"/><circle cx="450" cy="235" r="22" fill="#ef4444"/>
      <circle cx="190" cy="265" r="22" fill="#3b82f6"/><circle cx="450" cy="265" r="22" fill="#ef4444"/>
      <circle cx="190" cy="295" r="22" fill="#3b82f6"/><circle cx="450" cy="295" r="22" fill="#111827"/>
      <circle cx="190" cy="325" r="22" fill="#22c55e"/><circle cx="450" cy="325" r="22" fill="#a855f7"/>
      <circle cx="190" cy="355" r="22" fill="#111827"/><circle cx="450" cy="355" r="22" fill="#a855f7"/>
      <circle cx="190" cy="385" r="22" fill="#22c55e"/><circle cx="450" cy="385" r="22" fill="#22c55e"/>
      <circle cx="190" cy="415" r="22" fill="#22c55e"/><circle cx="450" cy="415" r="22" fill="#ffffff"/>
      <circle cx="190" cy="445" r="22" fill="#22c55e"/><circle cx="450" cy="445" r="22" fill="#22c55e"/>
      <circle cx="190" cy="475" r="22" fill="#f59e0b"/><circle cx="450" cy="475" r="22" fill="#22c55e"/>
      <circle cx="190" cy="505" r="22" fill="#c084fc"/><circle cx="450" cy="505" r="22" fill="#111827"/>
      <circle cx="190" cy="535" r="22" fill="#c084fc"/><circle cx="450" cy="535" r="22" fill="#22c55e"/>
      <circle cx="190" cy="565" r="22" fill="#c084fc"/><circle cx="450" cy="565" r="22" fill="#c084fc"/>
      <circle cx="190" cy="595" r="22" fill="#111827"/><circle cx="450" cy="595" r="22" fill="#c084fc"/>
      <circle cx="190" cy="625" r="22" fill="#fde047"/><circle cx="450" cy="625" r="22" fill="#fde047"/>
      <circle cx="190" cy="655" r="22" fill="#22c55e"/><circle cx="450" cy="655" r="22" fill="#111827"/>
      <circle cx="190" cy="685" r="22" fill="#22c55e"/><circle cx="450" cy="685" r="22" fill="#22c55e"/>
      <circle cx="190" cy="715" r="22" fill="#22c55e"/><circle cx="450" cy="715" r="22" fill="#111827"/>
      <circle cx="190" cy="745" r="22" fill="#22c55e"/><circle cx="450" cy="745" r="22" fill="#22c55e"/>
      <circle cx="190" cy="775" r="22" fill="#22c55e"/><circle cx="450" cy="775" r="22" fill="#22c55e"/>
      <circle cx="190" cy="805" r="22" fill="#111827"/><circle cx="450" cy="805" r="22" fill="#22c55e"/>
    </g>
    <g fill="#111827" font-size="15" font-weight="700">
      <text x="190" y="240">1</text><text x="450" y="240">2</text><text x="190" y="270">3</text><text x="450" y="270">4</text>
      <text x="190" y="300">5</text><text x="450" y="300">6</text><text x="190" y="330">7</text><text x="450" y="330">8</text>
      <text x="190" y="360">9</text><text x="450" y="360">10</text><text x="190" y="390">11</text><text x="450" y="390">12</text>
      <text x="190" y="420">13</text><text x="450" y="420">14</text><text x="190" y="450">15</text><text x="450" y="450">16</text>
      <text x="190" y="480">17</text><text x="450" y="480">18</text><text x="190" y="510">19</text><text x="450" y="510">20</text>
      <text x="190" y="540">21</text><text x="450" y="540">22</text><text x="190" y="570">23</text><text x="450" y="570">24</text>
      <text x="190" y="600">25</text><text x="450" y="600">26</text><text x="190" y="630">27</text><text x="450" y="630">28</text>
      <text x="190" y="660">29</text><text x="450" y="660">30</text><text x="190" y="690">31</text><text x="450" y="690">32</text>
      <text x="190" y="720">33</text><text x="450" y="720">34</text><text x="190" y="750">35</text><text x="450" y="750">36</text>
      <text x="190" y="780">37</text><text x="450" y="780">38</text><text x="190" y="810">39</text><text x="450" y="810">40</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <circle cx="450" cy="295" r="32" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle cx="450" cy="325" r="32" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle cx="450" cy="355" r="32" fill="none" stroke="#dc2626" stroke-width="6"/>
    <path d="M482 295 C650 250, 650 220, 710 220" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M482 325 C650 325, 650 320, 710 320" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M482 355 C650 405, 650 430, 710 430" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M710 220 l-18 -10 M710 220 l-18 12" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M710 320 l-18 -10 M710 320 l-18 12" fill="none" stroke="#dc2626" stroke-width="5"/>
    <path d="M710 430 l-18 -10 M710 430 l-18 12" fill="none" stroke="#dc2626" stroke-width="5"/>
    <text x="735" y="212" fill="#b91c1c">Pin 6 / GND → adapter GND</text>
    <text x="735" y="312" fill="#b91c1c">Pin 8 / GPIO14 TXD → adapter RXD</text>
    <text x="735" y="422" fill="#b91c1c">Pin 10 / GPIO15 RXD → adapter TXD</text>
  </g>

  <rect x="710" y="535" width="425" height="170" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="735" y="575" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">USB-UART adapter</text>
  <text x="735" y="615" font-family="Arial, sans-serif" font-size="22" fill="#111827">RXD  ← Pi TXD</text>
  <text x="735" y="650" font-family="Arial, sans-serif" font-size="22" fill="#111827">TXD  → Pi RXD</text>
  <text x="735" y="685" font-family="Arial, sans-serif" font-size="22" fill="#111827">GND  ↔ Pi GND</text>

  <rect x="70" y="870" width="1065" height="65" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="600" y="910" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#92400e">Use a 3.3 V TTL UART adapter. Leave VCC disconnected.</text>
</svg>
