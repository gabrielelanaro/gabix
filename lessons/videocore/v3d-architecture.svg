<svg xmlns="http://www.w3.org/2000/svg" viewBox="79 216 616 667">
<title>How V3D divides the work of drawing a triangle</title>
<desc>The control list executor reads commands in memory. During binning the primitive tile binner builds tile lists. Rendering uses those lists, rasterizes primitives, runs a fragment shader on a QPU, and stores tile colors to the framebuffer.</desc>
<defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path fill="#476477" d="M0 0 6 3 0 6z"/></marker></defs>
